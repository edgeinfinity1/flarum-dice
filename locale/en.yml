edgeinfinity-dice:
  forum:
    pending: "Pending: the server chooses the result only when a new post is saved."
    unrolled: "Not rolled: this placeholder belongs to an old post, an edit or a period when Dice was disabled. No retroactive roll."
    invalid_edit: "The dice sequence has changed. Saving will be rejected; keep the original count, ranges and order."
    rolled: "Server roll: {min} to {max}, {faces} faces; result {result}."
    error_locked: "The count, ranges and order of rolled dice cannot be changed. Edit surrounding text, or hide/delete the whole post."
    error_too_many: "A new post may contain at most {count} dice."
    effect_normal: "Normal"
    effect_success: "Critical success"
    effect_failure: "Critical failure"
    effect_positive: "Positive"
    effect_negative: "Negative"
    effect_zero: "Zero"
    effect_repeat: "Repeated digits"
    effect_sequence: "Consecutive digits"
    effect_special: "Special number"
  admin:
    intro: "Insert an integer die with [minimum, maximum]. Both endpoints are included; negative integers are supported. The server rolls when inserting a new post, never in previews or drafts."
    lifecycle: "Old posts are never rolled retroactively. Edits must preserve an existing dice sequence. Hidden posts keep results; permanent post deletion removes them. Disabling, removing or uninstalling retains the result column for reinstall. Explicit data destruction is documented separately."
    rules: "Rules and effects"
    maxDice: "Maximum dice per new post (1–100)"
    criticalEnabled: "Enable critical success / failure"
    criticalMinFaces: "Minimum faces for critical effects"
    criticalPercent: "Percentage of faces at each end (integer)"
    successHigh: "High results mean success (off: low results mean success)"
    critical_help: "Each end uses floor(faces × percentage), at least one face and at most half. Default: at least 20 faces and 5% at each end. Display only; odds are unchanged."
    signEnabled: "Color positive / negative / zero when the range crosses zero"
    repeatEnabled: "Highlight repeated digits (111, 666)"
    sequenceEnabled: "Highlight ascending / descending consecutive digits (123, 321; no wrap)"
    digitsMin: "Minimum digits for number effects (absolute value)"
    specialEnabled: "Highlight specified special numbers"
    specialNumbers: "Special numbers"
    numbers_help: "Comma-separated integers; up to 100 entries. Leave empty for none."
    priority: "Effect priority (left to right)"
    priority_help: "Include each once: special, repeat, sequence, success, failure, positive, negative, zero. The first match controls colors; the tooltip lists all matches."
    colors: "Light / dark colors"
    colors_help: "Use hexadecimal colors, optionally with alpha. Empty text/background inherit normal dice colors; empty icon follows text. Settings never change stored results."
    light: "Light theme"
    dark: "Dark theme"
    text: "Text"
    background: "Background"
    icon: "Icon"
    inherit: "Inherit"
    reset: "Restore defaults (save to apply)"
